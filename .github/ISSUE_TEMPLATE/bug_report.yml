name: Relatar um problema
description: Informe um comportamento incorreto ou inesperado no help-family.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Obrigado por ajudar. Não publique nomes, fotos, documentos ou informações médicas reais.
  - type: textarea
    id: description
    attributes:
      label: O que aconteceu?
      description: Descreva o comportamento observado e o resultado esperado.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Como reproduzir?
      placeholder: |
        1. Abra...
        2. Clique...
        3. Observe...
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Plataforma
      options:
        - Navegador local
        - Android
        - Demonstração pública
        - Build ou CI
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versão ou commit
      placeholder: Exemplo: 1.0.3 ou e0cf0b2
  - type: textarea
    id: context
    attributes:
      label: Contexto adicional
      description: Use somente dados fictícios em logs e capturas de tela.
