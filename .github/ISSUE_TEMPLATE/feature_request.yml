name: Sugerir uma melhoria
description: Proponha uma ideia para o help-family.
title: "[Ideia]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Qual problema a ideia resolve?
      description: Não inclua informações médicas ou pessoais reais.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Solução sugerida
      description: Explique o resultado desejado sem exigir uma implementação específica.
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Plataforma principal
      options:
        - Todas
        - Navegador local
        - Android
        - Demonstração pública
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacidade
      options:
        - label: A proposta mantém dados reais somente no dispositivo local e não conecta a demonstração a um backend.
          required: true
