plugins {
    id "com.android.application"
}

android {
    namespace "br.com.curafamilia.app"
    compileSdk 34

    defaultConfig {
        applicationId "br.com.curafamilia.app"
        minSdk 24
        targetSdk 34
        versionCode 4
        versionName "1.0.3"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    implementation "com.google.android.gms:play-services-mlkit-document-scanner:16.0.0"
}
